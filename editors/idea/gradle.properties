# A placeholder: the plugin has no version of its own. Every build passes
# the CLI's (-PpluginVersion), so the zip and the executable it carries are
# always the same release.
pluginVersion=0.0.0
# The plugin runs on the IDE's bundled Kotlin stdlib; never ship one.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
