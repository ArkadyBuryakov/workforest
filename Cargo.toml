[package]
name = "workforest"
version = "0.8.0"
edition = "2024"
description = "Git worktree forest management: create, open, and clean up per-branch worktrees with project-defined setup hooks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ArkadyBuryakov/workforest"
homepage = "https://github.com/ArkadyBuryakov/workforest"
keywords = ["git", "worktree", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
crossterm = "0.29"
indexmap = "2"
nix = { version = "0.31", features = ["fs", "process", "signal", "term", "poll", "user", "ioctl"] }
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
saphyr-parser = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml-edit = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)'] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
