name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/workforest/__init__.py)
          if [ -z "$version" ]; then
            echo "Could not parse __version__ from src/workforest/__init__.py" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag and release if missing
        env:
          # Must be a PAT, not github.token: releases created with the default
          # token do not trigger the release-published publisher workflows.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists — nothing to release."
          else
            # The release's own section of CHANGELOG.md is its notes; a
            # version that has none falls back to the commit list.
            notes=$(mktemp)
            if packaging/changelog/generate --release-notes "$version" > "$notes"; then
              gh release create "$tag" --target "$GITHUB_SHA" --notes-file "$notes"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
            fi
          fi
