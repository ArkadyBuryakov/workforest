name: Assets

# Every logo asset is derived from assets/src/ by assets/generate. Re-run it
# whenever a pull request touches the sources or the script, and commit the
# result — so a redrawn logo only ever has to be redrawn once. Pushes made
# with GITHUB_TOKEN do not trigger workflows, so this cannot loop.

on:
  pull_request:
    paths:
      - assets/**
      - .github/workflows/assets.yml

permissions:
  contents: write

jobs:
  generate:
    # Forks cannot be pushed to with this token; leave their PRs alone.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Regenerate assets
        run: assets/generate

      - name: Commit any difference
        run: |
          if git diff --quiet; then
            echo "assets are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Regenerate assets"
          git push
