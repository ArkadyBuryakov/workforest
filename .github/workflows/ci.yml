name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python uv make zsh groff

      - uses: actions/checkout@v4

      - name: Sync dev environment
        run: uv sync

      - name: Lint, type-check, test
        run: make check

  package-smoke:
    # Builds the wheel the AUR package would build and installs it into a
    # clean venv — catches missing package data and broken entry points.
    # The full `makepkg -si` + namcap check runs in the release workflow,
    # where a source tarball exists.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python python-build python-installer python-wheel python-hatchling man-db

      - uses: actions/checkout@v4

      - name: Build wheel (no isolation, like the PKGBUILD)
        run: python -m build --wheel --no-isolation

      - name: Install into a clean venv and smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/workforest --version
          /tmp/venv/bin/wf --version
          /tmp/venv/bin/workforest shell-init bash | bash -n
          /tmp/venv/bin/workforest shell-init zsh | head -1 | grep -q Workforest
          # man pages ride along in the wheel's share/man data, and shell-init
          # puts that directory on $MANPATH for venv installs
          MANPATH=/tmp/venv/share/man man -w workforest wf 5 workforest wf
          /tmp/venv/bin/workforest shell-init bash | grep -q 'MANPATH=/tmp/venv/share/man'
          # the init starter is package data too
          git init -q /tmp/repo
          (cd /tmp/repo && /tmp/venv/bin/workforest init)
          test -s /tmp/repo/.workforest.yaml

  binary:
    # The self-contained executable the editor plugins ship
    # (packaging/binary/build.sh). Only linux-x64 here, to keep PRs cheap:
    # the other three platforms are built when publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build the standalone executable
        run: packaging/binary/build.sh

      - name: Smoke test it (no Python, no venv, package data intact)
        run: |
          bin=$PWD/dist/binary/workforest
          "$bin" --version
          "$bin" shell-init bash | bash -n
          git init -q /tmp/repo
          cd /tmp/repo && "$bin" init && test -s .workforest.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-binary-linux-x64
          path: dist/binary/workforest

  vscode-extension:
    # editors/vscode: compile, unit tests (node:test, no VS Code download),
    # and the platform-specific .vsix that carries the CLI in bin/.
    needs: binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: workforest-binary-linux-x64
          path: editors/vscode/bin

      - name: Make the bundled CLI executable
        run: chmod +x bin/workforest

      - name: Install
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package for linux-x64
        run: npm run package -- --target linux-x64

      - name: The .vsix carries the CLI
        run: unzip -l workforest-linux-x64-*.vsix | grep -q 'extension/bin/workforest'

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-vscode
          path: editors/vscode/*.vsix

  plugin-idea:
    # The JetBrains plugin under editors/idea: compile, unit tests, and the
    # plugin zip, which carries one CLI per platform under bin/<os>-<arch>/
    # (only linux-x64 here; a published build ships all four).
    # verifyPlugin (downloads IDEs) is run by hand.
    needs: binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/idea
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: workforest-binary-linux-x64
          path: editors/idea/bin/linux-x64

      - name: Make the bundled CLI executable
        run: chmod +x bin/linux-x64/workforest

      - name: Compile, test, package
        run: ./gradlew --no-daemon build buildPlugin

      - name: The plugin zip carries the CLI
        run: unzip -l build/distributions/*.zip | grep -q 'bin/linux-x64/workforest'

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-idea
          path: editors/idea/build/distributions/*.zip
