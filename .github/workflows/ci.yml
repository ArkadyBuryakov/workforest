name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python uv make zsh groff

      - uses: actions/checkout@v4

      - name: Sync dev environment
        run: uv sync

      - name: Lint, type-check, test
        run: make check

  package-smoke:
    # Builds the wheel the AUR package would build and installs it into a
    # clean venv — catches missing package data and broken entry points.
    # The full `makepkg -si` + namcap check runs in the release workflow,
    # where a source tarball exists.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python python-build python-installer python-wheel python-hatchling man-db

      - uses: actions/checkout@v4

      - name: Build wheel (no isolation, like the PKGBUILD)
        run: python -m build --wheel --no-isolation

      - name: Install into a clean venv and smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/workforest --version
          /tmp/venv/bin/wf --version
          /tmp/venv/bin/workforest shell-init bash | bash -n
          /tmp/venv/bin/workforest shell-init zsh | head -1 | grep -q Workforest
          # man pages ride along in the wheel's share/man data, and shell-init
          # puts that directory on $MANPATH for venv installs
          MANPATH=/tmp/venv/share/man man -w workforest wf 5 workforest wf
          /tmp/venv/bin/workforest shell-init bash | grep -q 'MANPATH=/tmp/venv/share/man'
          # the init starter is package data too
          git init -q /tmp/repo
          (cd /tmp/repo && /tmp/venv/bin/workforest init)
          test -s /tmp/repo/.workforest.yaml

  vscode-extension:
    # editors/vscode: compile, unit tests (node:test, no VS Code download),
    # and a .vsix package — the same `npm run check` as locally.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile, test, package
        run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-vscode
          path: editors/vscode/*.vsix
