name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Formatting, clippy, and the tests with the coverage gate. The tests
    # run the built binary against throwaway repositories, in real shells
    # and on a pseudo-terminal: bash and zsh for the shell function, make
    # for `wf make`, groff for the man pages.
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh groff make

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format, lint, test with coverage
        run: make check

  test-macos:
    # The other supported platform: no /proc, BSD userland, a different pty.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: make test

  package-smoke:
    # Builds the wheel PyPI would get and installs it into a clean venv —
    # catches a wheel without its executables or its man pages. The AUR
    # and Homebrew recipes are exercised in their own release workflows,
    # where a source tarball exists.
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y man-db

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - name: Build the wheel and the source distribution
        run: uvx maturin build --release --locked --sdist --out dist

      - name: Install into a clean venv and smoke test
        run: |
          uv venv /tmp/venv
          uv pip install --python /tmp/venv/bin/python dist/*.whl
          /tmp/venv/bin/workforest --version
          /tmp/venv/bin/wf --version
          /tmp/venv/bin/workforest shell-init bash | bash -n
          /tmp/venv/bin/workforest shell-init zsh | head -1 | grep -q Workforest
          # man pages ride along as the wheel's data files, and shell-init
          # puts that directory on $MANPATH for installs like this one
          MANPATH=/tmp/venv/share/man man -w workforest wf 5 workforest wf
          /tmp/venv/bin/workforest shell-init bash | grep -q 'MANPATH=/tmp/venv/share/man'
          # the init starter is compiled in
          git init -q /tmp/repo
          (cd /tmp/repo && /tmp/venv/bin/workforest init)
          test -s /tmp/repo/.workforest.yaml

      - name: The source distribution builds on its own
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && cargo build --release --locked --bin workforest
          ./target/release/workforest --version

  binary:
    # The executable the editor plugins ship (packaging/binary/build.sh).
    # Only linux-x64 here, to keep PRs cheap: the other three platforms are
    # built when publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the executable
        run: packaging/binary/build.sh

      - name: Smoke test it (one file, its resources compiled in)
        run: |
          bin=$PWD/dist/binary/workforest
          "$bin" --version
          "$bin" shell-init bash | bash -n
          git init -q /tmp/repo
          cd /tmp/repo && "$bin" init && test -s .workforest.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-binary-linux-x64
          path: dist/binary/workforest

  vscode-extension:
    # editors/vscode: compile, unit tests (node:test, no VS Code download),
    # and the platform-specific .vsix that carries the CLI in bin/.
    needs: binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: workforest-binary-linux-x64
          path: editors/vscode/bin

      - name: Make the bundled CLI executable
        run: chmod +x bin/workforest

      - name: Install
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package for linux-x64
        run: npm run package -- --target linux-x64

      - name: The .vsix carries the CLI
        run: unzip -l ./*.vsix | grep -q 'extension/bin/workforest'

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-vscode
          path: editors/vscode/*.vsix

  plugin-idea:
    # The JetBrains plugin under editors/idea: compile, unit tests, and the
    # plugin zip, which carries one CLI per platform under bin/<os>-<arch>/
    # (only linux-x64 here; a published build ships all four).
    # verifyPlugin (downloads IDEs) is run by hand.
    needs: binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/idea
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: workforest-binary-linux-x64
          path: editors/idea/bin/linux-x64

      - name: Make the bundled CLI executable
        run: chmod +x bin/linux-x64/workforest

      - name: Compile, test, package
        run: ./gradlew --no-daemon build buildPlugin

      - name: The plugin zip carries the CLI
        run: unzip -l build/distributions/*.zip | grep -q 'bin/linux-x64/workforest'

      - uses: actions/upload-artifact@v4
        with:
          name: workforest-idea
          path: editors/idea/build/distributions/*.zip
