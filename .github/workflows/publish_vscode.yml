name: Publish VS Code extension

# Publishes editors/vscode to the Visual Studio Marketplace when a release
# is published, or on demand. One .vsix per platform, each carrying the
# `workforest` executable for it (packaging/binary/build.sh), so installing
# the extension is enough — no separate CLI install. Linux and macOS only:
# that is what workforest supports.
#
# The extension has no version of its own: package.json carries a
# placeholder and the packaging step stamps it with the CLI's __version__,
# so what the Marketplace serves is always the release frozen inside it. A
# (version, platform) pair already on the Marketplace is skipped, which makes
# a re-run of an old release a no-op and a re-run of a half-finished one pick
# up where it stopped. Needs the VSCE_PAT secret (a
# Marketplace personal access token for the publisher in package.json);
# without it the publish step is skipped.
#
# That token is an Azure DevOps *global* PAT ("All accessible organizations",
# scope Marketplace/Manage) — the Marketplace accepts nothing narrower, and
# global PATs are decommissioned on 2026-12-01. Before then this job has to
# move to Microsoft Entra (`vsce publish --azure-credential`, a user-assigned
# managed identity added as a member of the publisher) or to trusted
# publishing (`vsce publish --oidc`, no secret at all) once that ships — it is
# in vsce's main branch but not in a release as of 3.9.2.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The CLI each .vsix ships, one per platform.
  binaries:
    uses: ./.github/workflows/binaries.yml

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=ArkadyBuryakov.workforest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          pattern: workforest-binary-*
          path: ${{ github.workspace }}/binaries

      - name: Install
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Stamp the extension with the version of the CLI it ships
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/src/workforest/__init__.py")
          [ -n "$version" ] || { echo "cannot read __version__" >&2; exit 1; }
          npm pkg set version="$version"
          echo "packaging $version"

      - name: Package one .vsix per platform, each with its own CLI
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            rm -rf bin && mkdir bin
            cp "$GITHUB_WORKSPACE/binaries/workforest-binary-$target/workforest" bin/workforest
            chmod +x bin/workforest
            npx vsce package --no-dependencies --target "$target"
          done
          ls -l ./*.vsix

      # The Marketplace stalls often enough that one upload attempt is not a
      # release: vsce retries nothing outside the signed-package path, and its
      # socket timeout (3 minutes, from typed-rest-client) is not settable. So
      # publish one .vsix at a time and retry each on its own; --skip-duplicate
      # is per (version, platform), so a retry re-uploads only what is missing.
      - name: Publish
        if: env.VSCE_PAT != ''
        run: |
          for vsix in ./*.vsix; do
            for attempt in 1 2 3; do
              [ "$attempt" = 1 ] || sleep 30
              if npx vsce publish --no-dependencies --skip-duplicate \
                                  --packagePath "$vsix"; then
                continue 2
              fi
              echo "::warning::publishing $vsix failed (attempt $attempt of 3)"
            done
            echo "::error::giving up on $vsix"
            exit 1
          done
