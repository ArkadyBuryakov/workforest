name: Publish VS Code extension

# Publishes editors/vscode to the Visual Studio Marketplace when a release
# is published, or on demand. One .vsix per platform, each carrying the
# `workforest` executable for it (packaging/binary/build.sh), so installing
# the extension is enough — no separate CLI install. Linux and macOS only:
# that is what workforest supports.
#
# The extension has no version of its own: package.json carries a
# placeholder and the packaging step stamps it with the CLI's __version__,
# so what the Marketplace serves is always the release frozen inside it. A
# (version, platform) pair already on the Marketplace is skipped, which makes
# a re-run of an old release a no-op and a re-run of a half-finished one pick
# up where it stopped.
#
# Authentication is Microsoft Entra ID, not a Marketplace PAT. The job trades
# GitHub's OIDC token for an Entra one against a federated credential on an app
# registration, and `vsce publish --azure-credential` picks that up through the
# AzureCliCredential link of its credential chain. Nothing secret is stored:
# AZURE_CLIENT_ID and AZURE_TENANT_ID are identifiers, and without them the
# publish steps are skipped.
#
# This replaces a VSCE_PAT global PAT, which stopped working outright: the
# Marketplace accepted the token and then never answered — every authenticated
# request to /_apis/gallery hung for exactly the client's 180s socket timeout,
# from CI and from a workstation alike, while anonymous requests to the same
# endpoint answered in 0.35s. Global PATs are decommissioned on 2026-12-01
# regardless. Trusted publishing (`vsce publish --oidc`, which would need no
# Entra app at all) is still unreleased: absent from vsce 3.9.2 and from the
# 3.9.3-11 prerelease.
#
# One-time setup, none of which lives in this repo:
#   1. A *user-assigned managed identity* in Azure. Not an app registration:
#      that authenticates and then fails the publish itself with
#      InvalidAccessException (vscode-vsce#1023, closed not-planned). A managed
#      identity needs a subscription and a resource group; the identity is free.
#   2. On it, a federated credential for GitHub Actions: organization
#      ArkadyBuryakov, repository workforest, entity type "Environment", value
#      "vscode-marketplace". That value must match the `environment:` below or
#      Entra refuses the token exchange.
#   3. Its client and tenant ids stored as AZURE_CLIENT_ID and AZURE_TENANT_ID
#      in the vscode-marketplace environment.
#   4. The identity added as a Contributor member of the publisher at
#      marketplace.visualstudio.com/manage. The member search accepts exactly
#      one id, and it is none of the ids the Azure portal shows: it is the one
#      from app.vssps.visualstudio.com/_apis/profile/profiles/me, called while
#      signed in *as the identity*. The check below prints it, so the first run
#      of this workflow is what hands you the value step 4 needs — it fails,
#      you add the member, you re-run.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The CLI each .vsix ships, one per platform.
  binaries:
    uses: ./.github/workflows/binaries.yml

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
      url: https://marketplace.visualstudio.com/items?itemName=ArkadyBuryakov.workforest-vscode
    permissions:
      contents: read
      # Mint the GitHub OIDC token that azure/login trades for an Entra one.
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    env:
      # Identifiers, not credentials. AZURE_TENANT_ID also reaches vsce, which
      # passes it down as `az account get-access-token --tenant` — the tenant
      # login below has no subscription, so that flag is what makes it resolve.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          pattern: workforest-binary-*
          path: ${{ github.workspace }}/binaries

      - name: Install
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Stamp the extension with the version of the CLI it ships
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/src/workforest/__init__.py")
          [ -n "$version" ] || { echo "cannot read __version__" >&2; exit 1; }
          npm pkg set version="$version"
          echo "packaging $version"

      - name: Package one .vsix per platform, each with its own CLI
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            rm -rf bin && mkdir bin
            cp "$GITHUB_WORKSPACE/binaries/workforest-binary-$target/workforest" bin/workforest
            chmod +x bin/workforest
            npx vsce package --no-dependencies --target "$target"
          done
          ls -l ./*.vsix

      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The app holds a Marketplace publisher membership, not a role on any
          # Azure subscription, so a tenant-level login is all there is to do.
          allow-no-subscriptions: true

      # vsce's credential chain reaches ManagedIdentityCredential right after
      # the CLI one, and on a runner that link probes IMDS and hangs rather
      # than failing — a broken sign-in would stall the publish loop for the
      # better part of an hour instead of erroring. So prove the token exists
      # first, under a timeout. This is the exact call vsce makes.
      - name: Check the sign-in, and report the id the publisher must list
        if: env.AZURE_CLIENT_ID != ''
        run: |
          # 499b84ac-… is the Azure DevOps resource id vsce asks for.
          if ! timeout 60 az account get-access-token \
                 --resource 499b84ac-1321-427f-aa17-267ca6975798 \
                 --tenant "$AZURE_TENANT_ID" --query expiresOn -o tsv; then
            echo "::error::this identity got no Azure DevOps token — check the" \
                 "federated credential on the managed identity"
            exit 1
          fi
          id=$(timeout 60 az rest --method get --resource 499b84ac-1321-427f-aa17-267ca6975798 \
                 --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
                 --query id -o tsv) || id=""
          echo "::notice::publisher member id for this identity: ${id:-<lookup failed>}"

      # The Marketplace stalls often enough that one upload attempt is not a
      # release: vsce retries nothing outside the signed-package path, and its
      # socket timeout (3 minutes, from typed-rest-client) is not settable. So
      # publish one .vsix at a time and retry each on its own; --skip-duplicate
      # is per (version, platform), so a retry re-uploads only what is missing.
      - name: Publish
        if: env.AZURE_CLIENT_ID != ''
        run: |
          for vsix in ./*.vsix; do
            for attempt in 1 2 3; do
              [ "$attempt" = 1 ] || sleep 30
              if npx vsce publish --no-dependencies --skip-duplicate \
                                  --azure-credential --packagePath "$vsix"; then
                continue 2
              fi
              echo "::warning::publishing $vsix failed (attempt $attempt of 3)"
            done
            echo "::error::giving up on $vsix"
            exit 1
          done
