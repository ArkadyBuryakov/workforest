# Workforest — global configuration example
#
# Locations (first existing basename wins: config.yaml → config.yml → config.json):
#   system layer:  /etc/workforest/config.yaml
#   user layer:    $XDG_CONFIG_HOME/workforest/config.yaml   (~/.config/workforest/config.yaml)
#
# Layer precedence (low → high):
#   built-in defaults → system → user → project shared (repo root)
#   → project local (.vscode/ or .idea/) → CLI flags
#
# Merge semantics:
#   scalars and lists REPLACE the lower layer;
#   mappings (`openers`, `wrappers`, `scripts`) MERGE per key, a key set to
#   `null` removes the inherited entry.
#
# Every key is optional. The values shown at the top of each section are the
# built-in defaults — a missing key and an explicitly-default key behave the
# same. The global layers are the natural home for ENVIRONMENT concerns
# (terminal, editor, personal helper scripts); repo concerns belong in the
# project config (see examples/.workforest.yaml).

# ---------------------------------------------------------------------------
# Where managed worktrees live — a path template expanded with the WF_*
# variables (the same family your scripts receive) plus ordinary environment
# variables, then path-normalized:
#   $WF_MAIN   absolute path of the main worktree
#   $WF_NAME   repo name (the main checkout's directory name)
#
# Default: a `worktrees/` folder next to the main checkout, namespaced per
# repo, so ~/src/api → ~/src/worktrees/api/<branch-short-name>.
# ---------------------------------------------------------------------------
worktrees_dir: "$WF_MAIN/../worktrees/$WF_NAME"

# Alternatives:
# worktrees_dir: "$HOME/worktrees/$WF_NAME"     # all forests in one place
# worktrees_dir: "$WF_MAIN/../worktrees"        # bash-MVP flat layout

# ---------------------------------------------------------------------------
# The WF_* variable family — one set of variables, available everywhere.
#
#   $WF_MAIN            main worktree path        /home/user/Projects/project_name
#   $WF_NAME            repo name                 project_name
#   $WF_WORKTREES_DIR   resolved worktrees dir    /home/user/Projects/worktrees/project_name
#   $WF_WORKTREE        this worktree's path      .../worktrees/project_name/feat-x
#   $WF_BRANCH          its branch                feat/x   (empty if detached)
#   $WF_TARGET          the -p argument           src/foo.py   (default ".")
#   $WF_TITLE           window label              "project_name: feat-x"
#   $WF_ENV             all of the above as shell-quoted NAME=value assignments
#   $WF_COMMAND         (wrappers only) the opener command, unexpanded
#
# `opener`/`openers`/`wrappers` are plain shell commands, run via
# `$SHELL -c` with the family exported — standard shell rules, no template
# syntax of our own:
#   * "$WF_X"   exactly ONE argument (use this unless you want splitting)
#   * $WF_X     word-splits into multiple arguments
# The launched process (editor, terminal, scripts they spawn) also receives
# the family as real environment variables.
#
# Exceptions to "everywhere":
#   * `worktrees_dir` sees only $WF_MAIN/$WF_NAME (the rest don't exist yet)
#   * scripts don't get WF_TARGET/WF_TITLE (launch-only concepts)
#   * your interactive shell never gets them (they're scoped to the opener)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Default opener — what runs when you `wf create`/`wf open` without -o.
#
# Value is an `openers` name, or a shell command used verbatim (the same
# resolution `-o` uses).
#
# Default: "" — falls back to $VISUAL, then $EDITOR, then errors out asking
# you to set one. Workforest never assumes a specific editor.
# ---------------------------------------------------------------------------
opener: ""

# opener: win                       # a name defined in `openers`
# opener: '$EDITOR "$WF_TARGET"'    # or a shell command

# ---------------------------------------------------------------------------
# Openers and wrappers — what runs and where.
#
# Every entry is a shell command (a plain string), or a mapping:
#   command: ...        a shell command — always literal, never a name
#   from: NAME          (openers only) reuse another opener's command, and
#                       its `background` unless set here. One level: NAME
#                       has a `command` of its own.
#   background: true    spawn it detached and return at once, instead of
#                       running it in your terminal (GUI apps, `tmux
#                       new-window`, anything that hands off to a daemon)
#   wrap: NAME          (openers only) run it through a wrapper
# An opener has exactly one of `command`/`from`. `wrap` and `background`
# never go together: the wrapper decides where the whole thing runs,
# through its own `background` flag. `from` and `wrap` names are checked
# when the config loads.
#
# In your terminal means: the `wf` wrapper does `cd <worktree>` and runs
# `WF_*=... $SHELL -c '<command>'`, so you end up in the worktree when the
# command exits. Background processes shed activation state inherited from
# your shell (Python venv, conda, nvm, rvm), and one that dies right away is
# reported with its stderr instead of failing silently.
#
# Both run with the worktree root as working directory; $WF_TARGET is the
# -p argument, "." by default. A command that ignores it simply runs in the
# worktree.
#
# These keys are environment-specific — they belong in your USER config,
# never in a project config. That is also the answer for a machine without
# your terminal emulator (ssh): its own user config simply has no wrapper.
# Per launch, `-w NAME` overrides the opener's wrapper and `-w ''` drops it.
# ---------------------------------------------------------------------------

# Wrappers — HOW to run a command somewhere else. A wrapper gets the opener
# command as $WF_COMMAND, still unexpanded: run it through a shell of its
# own for its $WF_* references to resolve (`$SHELL -c "$WF_COMMAND"`).
# Background wrappers open windows/panes; attached ones run in your
# terminal (`direnv exec`, `ssh host`, `nix develop --command`).
#
# Default: {}
wrappers: {}

# wrappers:
#   kitty:
#     command: kitty --title "$WF_TITLE" --directory "$WF_WORKTREE" $SHELL -c "$WF_COMMAND"
#     background: true
#   foot:
#     command: foot --title="$WF_TITLE" --working-directory="$WF_WORKTREE" $SHELL -c "$WF_COMMAND"
#     background: true
#   alacritty:
#     command: alacritty --title "$WF_TITLE" --working-directory "$WF_WORKTREE" -e $SHELL -c "$WF_COMMAND"
#     background: true
#   direnv: 'direnv exec "$WF_WORKTREE" $SHELL -c "$WF_COMMAND"'   # attached
#
#   # tmux windows are created by the tmux SERVER, which does not inherit this
#   # environment — `export $WF_ENV` re-creates the family in the new window:
#   tmux:
#     command: tmux new-window -n "$WF_TITLE" -c "$WF_WORKTREE" "export $WF_ENV; $WF_COMMAND"
#     background: true

# Openers — WHAT to run, for -o NAME and the TUI opener carousel.
#
# Default: {} — the TUI then falls back to two derived entries: the default
# opener and $SHELL.
openers: {}

# openers:
#   edit: '$EDITOR "$WF_TARGET"'    # editors usually want the path argument
#   shell: "$SHELL"                 # just a shell in the worktree
#   git: "lazygit"                  # runs with cwd = worktree, no argument
#   agent: "claude"
#   code: {command: 'code "$WF_WORKTREE"', background: true}      # GUI app
#   tab:  {command: 'tmux new-window -n "$WF_TITLE" -c "$WF_WORKTREE"', background: true}
#   win:  {from: edit, wrap: kitty}         # editor in a new window
#   env:  {from: edit, wrap: direnv}        # editor here, through direnv
#   pane: {from: edit, wrap: tmux}          # editor in a tmux window
#   here: {from: code, background: false}   # code, but attached

# ---------------------------------------------------------------------------
# Personal named scripts — available via `workforest run NAME` in every repo.
# Merged per key with project `scripts` (project wins on conflict).
#
# Scripts run from the current worktree root via $SHELL -c with:
#   WF_MAIN, WF_NAME, WF_WORKTREE, WF_WORKTREES_DIR, WF_BRANCH
#
# Default: {}
# ---------------------------------------------------------------------------
scripts: {}

# scripts:
#   sync: "git fetch --all --prune && git status -sb"
#   diff-main: "git diff $(git -C \"$WF_MAIN\" branch --show-current)..."

# ---------------------------------------------------------------------------
# Seconds a stopped script (`workforest stop`, or an `exclusive` script
# starting elsewhere) gets to end after SIGTERM before SIGKILL. A script
# entry's own `stop_timeout` overrides this for that script.
#
# Default: 30
# ---------------------------------------------------------------------------
stop_timeout: 30

# ---------------------------------------------------------------------------
# `symlinks` and `setup_scripts` are valid here too (any key is valid at any
# layer), but they are repo concerns — you almost always want them in the
# project config instead. Defaults: [] and [].
# ---------------------------------------------------------------------------
# symlinks: []
# setup_scripts: []
