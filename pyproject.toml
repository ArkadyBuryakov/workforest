# The PyPI package is a thin wrapper around the executables: maturin builds
# the Rust binaries (`workforest`, and `wf`, which runs it) into a platform
# wheel with no Python code in it, so `uv tool install workforest` and
# `pipx install workforest` put them on PATH like any other install. The
# version is Cargo.toml's.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "workforest"
dynamic = ["version"]
description = "Git worktree forest management: create, open, and clean up per-branch worktrees with project-defined setup hooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arkady Buryakov", email = "arkady@buryakov.pro" }]
requires-python = ">=3.8"
keywords = ["git", "worktree", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/ArkadyBuryakov/workforest"

[tool.maturin]
bindings = "bin"
strip = true
# Everything under packaging/pypi/data/ is installed under the prefix by
# pip/uv: the man pages land in <prefix>/share/man — the tool environment
# for `uv tool`/pipx, where `workforest shell-init` puts them on $MANPATH.
data = "packaging/pypi"
