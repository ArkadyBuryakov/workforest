[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workforest"
dynamic = ["version"]
description = "Git worktree forest management: create, open, and clean up per-branch worktrees with project-defined setup hooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arkady Buryakov", email = "arkady@buryakov.pro" }]
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0"]
keywords = ["git", "worktree", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/arkadyb/workforest"

[project.scripts]
workforest = "workforest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/workforest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/workforest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=workforest --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["workforest"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
strict = true
files = ["src/workforest"]
python_version = "3.14"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # pathlib
    "RUF",
]
